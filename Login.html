<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>صفحة التسجيل للسكن في مدينة أم دبيكرات </title>
    <style>
      body {
    margin: 0;
    min-height: 100vh;
    position: relative;
    isolation: isolate;
    overflow-x: hidden;

    background-color: #F4F7FF;

    background-image:
        radial-gradient(
            ellipse at 15% 20%,
            rgba(157, 221, 255, 0.85) 0%,
            transparent 55%
        ),
        radial-gradient(
            ellipse at 85% 75%,
            rgba(224, 190, 255, 0.8) 0%,
            transparent 55%
        ),
        radial-gradient(
            ellipse at 55% 45%,
            rgba(255, 213, 224, 0.65) 0%,
            transparent 60%
        ),
        linear-gradient(
            135deg,
            #F4F7FF 0%,
            #E8F4FF 35%,
            #F4EFFF 70%,
            #FFF1F5 100%
        );

    background-size:
        200% 200%,
        200% 200%,
        200% 200%,
        200% 200%;

    background-position:
        0% 0%,
        100% 100%,
        50% 50%,
        0% 50%;

    animation: livingBackground 18s ease-in-out infinite alternate;
}

/* تحريك التدرجات */
@keyframes livingBackground {
    0% {
        background-position:
            0% 0%,
            100% 100%,
            50% 50%,
            0% 50%;
    }

    50% {
        background-position:
            100% 50%,
            0% 50%,
            100% 0%,
            50% 50%;
    }

    100% {
        background-position:
            50% 100%,
            50% 0%,
            0% 100%,
            100% 50%;
    }
}

/* طبقة Noise لتقليل فواصل التدرج */
body::before {
    content: "";
    position: fixed;
    inset: -50%;
    z-index: -1;
    pointer-events: none;

    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='.12'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

    opacity: 0.35;
    mix-blend-mode: multiply;
}

/* احترام إعداد تقليل الحركة */
@media (prefers-reduced-motion: reduce) {
    body {
        animation: none;
    }
}
      header {
        margin: clamp(200px,3vw,400px) 0;

        }
      h1 {
        text-align: center;
        color: #1a0f11;
      }
      p {
        text-align: center;
        color: #1a0f11;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>عذرا لم يتم بناء الصفحة بعد</h1>
      <p>المطور يأخذ إستراحة 🙂👍</p>
    </header>
  </body>
</html>
